<!-- ══════════ PRODUCT DETAIL MODAL ══════════ -->
<div class="detail-backdrop" id="detailModal">
  <div class="detail-modal" role="dialog" aria-modal="true">
    <button class="detail-close" id="detailClose" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M18 6 6 18M6 6l12 12"/>
      </svg>
    </button>

    <div class="detail-grid">
      <div class="detail-media" id="detailMedia"></div>

      <div class="detail-info">
        <span class="detail-cat" id="detailCat"></span>
        <h2 class="detail-name" id="detailName"></h2>
        <div class="detail-price" id="detailPrice"></div>
        <p class="detail-desc" id="detailDesc"></p>

        <div class="detail-block">
          <label>Size</label>
          <div class="opt-row" id="detailSizes"></div>
        </div>

        <div class="detail-block">
          <label>Color</label>
          <div class="color-row" id="detailColors"></div>
        </div>

        <div class="detail-block">
          <label>Quantity</label>
          <div class="qty-row">
            <button id="qtyMinus" aria-label="Decrease">−</button>
            <span id="qtyValue">1</span>
            <button id="qtyPlus" aria-label="Increase">+</button>
          </div>
        </div>

        <button class="btn btn-gold detail-add" id="detailAddBtn">
          Add to Bag
          <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>

        <div class="detail-meta">
          <div><b>Fabric</b><span id="detailFabric"></span></div>
          <div><b>Care</b><span id="detailCare"></span></div>
          <div><b>SKU</b><span id="detailSku"></span></div>
        </div>
      </div>
    </div>
  </div>
</div>
