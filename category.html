<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Category — COOLISM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="category">

<div class="topbar">
  <div class="marquee" id="marquee">
    <span>Free nationwide delivery over Rs 5,000 <i>◆</i></span>
    <span>New Winter Drop is live <i>◆</i></span>
  </div>
</div>

<header class="nav-wrap" id="navWrap">
  <div class="container nav">
    <a href="index.html" class="logo"><span class="dot"></span>COOL<em>ISM</em></a>
    <nav class="nav-links">
      <a href="index.html#shop">Shop</a>
      <a href="index.html#collections">Collections</a>
      <a href="index.html#story">Our Story</a>
      <a href="index.html#contact">Contact</a>
    </nav>
    <div class="nav-actions">
      <button class="btn-ghost" id="accountBtn">Login</button>
      <button class="icon-btn" id="accountIcon"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></button>
      <button class="icon-btn" id="cartBtn"><svg viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg><span class="badge" id="cartCount">0</span></button>
    </div>
  </div>
</header>

<section class="section category-hero">
  <div class="container">
    <a href="index.html" class="back-link">← Back to Home</a>
    <p class="eyebrow" id="catEyebrow">Category</p>
    <h1 id="catTitle">Loading...</h1>
    <p class="cat-sub" id="catSub">—</p>
  </div>
</section>

<section class="section" style="padding-top:0">
  <div class="container">
    <div class="grid-products" id="productGrid"></div>
  </div>
</section>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="cartDrawer">
  <div class="drawer-head">
    <h3>Your Bag</h3>
    <button class="x" id="cartClose"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="drawer-body" id="cartBody"></div>
  <div class="drawer-foot">
    <div class="total-row"><span>Subtotal</span><b id="cartTotal">Rs 0</b></div>
    <p class="note">Free shipping over Rs 5,000.</p>
    <button class="btn btn-silver" id="checkoutBtn">Checkout <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </div>
</aside>

<div class="detail-backdrop" id="detailModal">
  <div class="detail-modal">
    <button class="detail-close" id="detailClose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <div class="detail-grid">
      <div class="detail-media" id="detailMedia"></div>
      <div class="detail-info">
        <span class="detail-cat" id="detailCat"></span>
        <h2 class="detail-name" id="detailName"></h2>
        <div class="detail-price" id="detailPrice"></div>
        <p class="detail-desc" id="detailDesc"></p>
        <div class="detail-block"><label>Size</label><div class="opt-row" id="detailSizes"></div></div>
        <div class="detail-block"><label>Color</label><div class="color-row" id="detailColors"></div></div>
        <div class="detail-block"><label>Quantity</label>
          <div class="qty-row"><button id="qtyMinus">−</button><span id="qtyValue">1</span><button id="qtyPlus">+</button></div>
        </div>
        <button class="btn btn-silver detail-add" id="detailAddBtn">Add to Bag <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        <div class="detail-meta">
          <div><b>Fabric</b><span id="detailFabric"></span></div>
          <div><b>Care</b><span id="detailCare"></span></div>
          <div><b>SKU</b><span id="detailSku"></span></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span class="dot"></span><span id="toastMsg">Added to bag</span></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="app.js"></script>
</body>
</html>
